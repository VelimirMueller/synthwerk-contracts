# Event catalog: one entry per CloudEvents type.
# nats_subject is the NATS subject, not the CloudEvents subject attribute (the entity id).
# Naming rules: docs/naming.md. Lifecycle: draft -> active -> deprecated -> retired.
# tests/contract checks every entry against its schema, its example and the naming rules.
events:
  - type: dev.synthwerk.pulse.target.status_changed.v1
    nats_subject: evt.pulse.target.status_changed.v1
    stream: EVT_PULSE
    producer: pulse
    consumers: [pulse, studio]
    status: draft
    schema: pulse/target.status_changed.v1.schema.json
    example: examples/dev.synthwerk.pulse.target.status_changed.v1.json

  - type: dev.synthwerk.llm.toolcall.executed.v1
    nats_subject: evt.llm.toolcall.executed.v1
    stream: EVT_LLM
    producer: llm
    consumers: [pulse]
    status: deprecated # D-44: scope vocabulary tenant/platform-admin renamed to org/operator. Superseded by v2.
    schema: llm/toolcall.executed.v1.schema.json
    example: examples/dev.synthwerk.llm.toolcall.executed.v1.json

  - type: dev.synthwerk.llm.toolcall.executed.v2
    nats_subject: evt.llm.toolcall.executed.v2
    stream: EVT_LLM
    producer: llm
    consumers: [pulse]
    status: draft
    schema: llm/toolcall.executed.v2.schema.json
    example: examples/dev.synthwerk.llm.toolcall.executed.v2.json

  - type: dev.synthwerk.llm.message.completed.v1
    nats_subject: evt.llm.message.completed.v1
    stream: EVT_LLM
    producer: llm
    consumers: [pulse]
    status: draft
    schema: llm/message.completed.v1.schema.json
    example: examples/dev.synthwerk.llm.message.completed.v1.json

  - type: dev.synthwerk.identity.org.created.v1
    nats_subject: evt.identity.org.created.v1
    stream: EVT_IDENTITY
    producer: identity
    consumers: [pulse]
    status: draft
    schema: identity/org.created.v1.schema.json
    example: examples/dev.synthwerk.identity.org.created.v1.json

  - type: dev.synthwerk.identity.user.created.v1
    nats_subject: evt.identity.user.created.v1
    stream: EVT_IDENTITY
    producer: identity
    consumers: [pulse]
    status: draft
    schema: identity/user.created.v1.schema.json
    example: examples/dev.synthwerk.identity.user.created.v1.json

  - type: dev.synthwerk.identity.member.role_changed.v1
    nats_subject: evt.identity.member.role_changed.v1
    stream: EVT_IDENTITY
    producer: identity
    consumers: [pulse, llm]
    status: draft
    schema: identity/member.role_changed.v1.schema.json
    example: examples/dev.synthwerk.identity.member.role_changed.v1.json

  - type: dev.synthwerk.identity.app.created.v1
    nats_subject: evt.identity.app.created.v1
    stream: EVT_IDENTITY
    producer: identity
    consumers: [pulse]
    status: draft
    schema: identity/app.created.v1.schema.json
    example: examples/dev.synthwerk.identity.app.created.v1.json
