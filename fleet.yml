# fleet.yml: tier and visibility of this repo (STANDARD.md). Exceptions: docs/rollout.md.
tier: library
visibility: public
exceptions:
  - rule: WF-FILE-02
    value: [feature-doc.yml]
    reason: The feature-doc check (synthwerk D-16) fails a PR that changes a contract without its docs/features page, and the template has no such stage.
  - rule: WF-NAME-02
    value:
      ci.yml: [spec, codegen, breaking, kit, integration, shell]
    reason: The contract gates (Spectral, codegen drift, oasdiff and eventcompat, kit lint, integration tests, shellcheck) have no fleet stage, so they run as extra ci.yml jobs that conclusion also requires.
  - rule: CI-COST-15
    value: 9
    reason: The six contract gates run as parallel jobs next to lint, unit and build; the repo is public, so the minutes cost nothing.
    expires: 2027-04-30
  - rule: GOV-RS-02
    value: no develop branch
    reason: The repo is trunk-only on main until the control repo creates develop (fleet-standard#7).
  - rule: GOV-RS-04
    value: "default-branch ruleset 'main: checks required' (25520293) with context conclusion"
    reason: The main ruleset predates the standard; its required context moved from gate to conclusion on 2026-10-28, and the control repo replaces the whole ruleset (fleet-standard#7).
  - rule: GOV-ENV-10
    value: no release environment
    reason: The Go module publishes by go/v* tag through the Go module proxy, which needs no publish identity.
