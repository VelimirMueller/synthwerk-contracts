openapi: 3.1.0
info:
  title: Synthwerk identity
  version: 0.2.0
  summary: The caller, orgs and roles. The M2 stubs of synthwerk-identity.
  description: |
    The org contract of synthwerk-identity (M2 spec #29, D-44).
    - An org is a Zitadel org. The vocabulary is `org` everywhere, never `tenant`.
    - Org roles are `owner`, `admin` and `member`. The platform role is `operator`. It sits outside every org.
    - An org the caller does not belong to answers 404, not 403. The API does not leak that it exists.
    - Errors are RFC 9457 `application/problem+json` with a stable `code`.
    - Org members and their roles: `/v1/orgs/{orgId}/members` (#29). Owner and admin change roles; a member gets 403.
    - Roles are checked from the token first. Every write and every privileged read (`listMembers`) then checks the stored membership: it wins over a stale token, so a demoted admin loses access at once, not at token expiry.
    - Apps of an org and their origin allow-list: `/v1/orgs/{orgId}/apps` (#30). A widget on an allowed origin gets a short-lived widget token: `POST /v1/apps/{appId}/widget-tokens`.
    - Entitlements: the plan of an org and its limits (#31). A new org gets the plan `free`. Other services read them over HTTP and get `dev.synthwerk.identity.org.entitlements_changed.v1` on every change.
  license:
    name: MIT
    identifier: MIT
  contact:
    name: Velimir Mueller
    url: https://github.com/VelimirMueller/synthwerk-contracts
tags:
  - name: me
    description: The signed-in caller.
  - name: orgs
    description: Orgs the caller belongs to.
  - name: members
    description: Members of an org and their org roles.
  - name: apps
    description: Apps of an org. Each app has an origin allow-list.
  - name: widget-tokens
    description: Short-lived tokens for a widget on an allowed origin.
  - name: entitlements
    description: The plan of an org and its limits.
security:
  - bearer: []
paths:
  /v1/me:
    get:
      operationId: identity.getMe
      summary: Get the caller
      description: The subject, the org and the roles of the token.
      tags: [me]
      security:
        - bearer: []
      responses:
        "200":
          description: The caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
              example:
                subject: "283746192837461928"
                org:
                  id: 0199f3a0-5b6c-7d8e-9f0a-1b2c3d4e5f60
                  name: Synthwerk
                  slug: synthwerk
                  created_at: "2026-10-23T08:00:00Z"
                roles: [owner, operator]
        "401":
          $ref: "#/components/responses/Unauthenticated"
  /v1/me/entitlements:
    get:
      operationId: identity.getMyEntitlements
      summary: Get the entitlements of the caller's org
      description: |
        The plan and the limits of the org the token acts in. Any org role may read it.
        - A service that acts for a user (for example llm for quotas) forwards the caller's token. It needs no org id of its own.
        - An unknown org, or a token without an org role, answers 404.
      tags: [entitlements]
      security:
        - bearer: []
      responses:
        "200":
          description: The entitlements of the caller's org.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Entitlements"
              example:
                org_id: 0199f3a0-5b6c-7d8e-9f0a-1b2c3d4e5f60
                plan: free
                limits:
                  llm_tokens_per_user_per_day: 50000
                  llm_tokens_per_org_per_day: 500000
                  apps_per_org: 3
                version: 1
                updated_at: "2026-10-29T08:00:00Z"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/orgs:
    get:
      operationId: identity.listOrgs
      summary: List orgs
      description: Orgs the caller is a member of. An operator sees every org. Cursor paging, max 100 per page.
      tags: [orgs]
      security:
        - bearer: []
      parameters:
        - name: limit
          in: query
          required: false
          description: Page size.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: cursor
          in: query
          required: false
          description: The `next_cursor` of the previous page.
          schema:
            type: string
            maxLength: 256
      responses:
        "200":
          description: One page of orgs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgPage"
              example:
                items:
                  - id: 0199f3a0-5b6c-7d8e-9f0a-1b2c3d4e5f60
                    name: Synthwerk
                    slug: synthwerk
                    created_at: "2026-10-23T08:00:00Z"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
    post:
      operationId: identity.createOrg
      summary: Create an org
      description: Creates an org and its Zitadel org. The caller becomes its `owner`. Emits `dev.synthwerk.identity.org.created.v1`.
      tags: [orgs]
      security:
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrgRequest"
            example:
              name: Acme Labs
              slug: acme-labs
      responses:
        "201":
          description: Org created.
          headers:
            Location:
              description: Path of the new org.
              schema:
                type: string
                maxLength: 128
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Org"
              example:
                id: 0199f3a1-2c3d-7e4f-8a5b-6c7d8e9f0a1b
                name: Acme Labs
                slug: acme-labs
                created_at: "2026-10-23T08:30:00Z"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/orgs/{orgId}:
    parameters:
      - $ref: "#/components/parameters/OrgId"
    get:
      operationId: identity.getOrg
      summary: Get an org
      description: Org detail. Needs a membership in the org, or the role `operator`.
      tags: [orgs]
      security:
        - bearer: []
      responses:
        "200":
          description: The org.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Org"
              example:
                id: 0199f3a0-5b6c-7d8e-9f0a-1b2c3d4e5f60
                name: Synthwerk
                slug: synthwerk
                created_at: "2026-10-23T08:00:00Z"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/orgs/{orgId}/entitlements:
    parameters:
      - $ref: "#/components/parameters/OrgId"
    get:
      operationId: identity.getOrgEntitlements
      summary: Get the entitlements of an org
      description: The plan and the limits of the org. Needs an org role in the org (any role), or the role `operator`.
      tags: [entitlements]
      security:
        - bearer: []
      responses:
        "200":
          description: The entitlements of the org.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Entitlements"
              example:
                org_id: 0199f3a0-5b6c-7d8e-9f0a-1b2c3d4e5f60
                plan: free
                limits:
                  llm_tokens_per_user_per_day: 50000
                  llm_tokens_per_org_per_day: 500000
                  apps_per_org: 3
                version: 1
                updated_at: "2026-10-29T08:00:00Z"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/orgs/{orgId}/members:
    parameters:
      - $ref: "#/components/parameters/OrgId"
    get:
      operationId: identity.listMembers
      summary: List members
      description: Members of the org and their org roles. Needs the role `owner` or `admin` in the org, or `operator`. The stored membership must also be `owner` or `admin`, so a token issued before a demotion gets 403. Cursor paging, max 100 per page.
      tags: [members]
      security:
        - bearer: []
      parameters:
        - name: limit
          in: query
          required: false
          description: Page size.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: cursor
          in: query
          required: false
          description: The `next_cursor` of the previous page.
          schema:
            type: string
            maxLength: 256
      responses:
        "200":
          description: One page of members.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberPage"
              example:
                items:
                  - user_id: "283746192837461928"
                    role: owner
                    updated_at: "2026-10-23T08:30:00Z"
                  - user_id: "396370217707541255"
                    role: member
                    updated_at: "2026-10-28T09:00:00Z"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/orgs/{orgId}/members/{userId}:
    parameters:
      - $ref: "#/components/parameters/OrgId"
      - $ref: "#/components/parameters/UserId"
    patch:
      operationId: identity.changeMemberRole
      summary: Change the role of a member
      description: |
        Sets the org role of a member. Emits `dev.synthwerk.identity.member.role_changed.v1` when the role changes.
        - `owner` and `admin` may set `admin` or `member` on a member that is not an owner.
        - Only an `owner` grants `owner` or changes the role of an owner.
        - A `member` gets 403. An `operator` gets 403: operator access is read only.
        - The last owner keeps the role (409 `last_owner`). Nobody changes their own role (409 `own_role`).
        - The same role again answers 200 and emits nothing.
      tags: [members]
      security:
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeMemberRoleRequest"
            example:
              role: admin
      responses:
        "200":
          description: The member with the new role.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
              example:
                user_id: "396370217707541255"
                role: admin
                updated_at: "2026-10-28T09:15:00Z"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/RoleConflict"
        "502":
          $ref: "#/components/responses/UpstreamUnavailable"
  /v1/orgs/{orgId}/apps:
    parameters:
      - $ref: "#/components/parameters/OrgId"
    get:
      operationId: identity.listApps
      summary: List apps
      description: Apps of the org, oldest first. Needs a membership in the org, or the role `operator`. Cursor paging, max 100 per page.
      tags: [apps]
      security:
        - bearer: []
      parameters:
        - name: limit
          in: query
          required: false
          description: Page size.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: cursor
          in: query
          required: false
          description: The `next_cursor` of the previous page.
          schema:
            type: string
            maxLength: 256
      responses:
        "200":
          description: One page of apps.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppPage"
              example:
                items:
                  - id: 019a3b10-7c2d-7e4f-8a5b-6c7d8e9f0a1b
                    org_id: 0199f3a0-5b6c-7d8e-9f0a-1b2c3d4e5f60
                    name: Shop website
                    allowed_origins: ["https://shop.example", "http://localhost:3000"]
                    created_at: "2026-10-29T10:00:00Z"
                    updated_at: "2026-10-29T10:00:00Z"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: identity.createApp
      summary: Create an app
      description: |
        Creates an app with its origin allow-list. Emits `dev.synthwerk.identity.app.created.v1`.
        - Needs the role `owner` or `admin` in the org. The stored membership must agree. A `member` gets 403. An `operator` gets 403: operator access is read only.
        - Each origin is `scheme://host[:port]`, nothing more. The rules are in `AppOrigin`.
      tags: [apps]
      security:
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAppRequest"
            example:
              name: Shop website
              allowed_origins: ["https://shop.example", "http://localhost:3000"]
      responses:
        "201":
          description: App created.
          headers:
            Location:
              description: Path of the new app.
              schema:
                type: string
                maxLength: 128
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/App"
              example:
                id: 019a3b10-7c2d-7e4f-8a5b-6c7d8e9f0a1b
                org_id: 0199f3a0-5b6c-7d8e-9f0a-1b2c3d4e5f60
                name: Shop website
                allowed_origins: ["https://shop.example", "http://localhost:3000"]
                created_at: "2026-10-29T10:00:00Z"
                updated_at: "2026-10-29T10:00:00Z"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/orgs/{orgId}/apps/{appId}:
    parameters:
      - $ref: "#/components/parameters/OrgId"
      - $ref: "#/components/parameters/AppId"
    get:
      operationId: identity.getApp
      summary: Get an app
      description: One app with its origin allow-list. Needs a membership in the org, or the role `operator`.
      tags: [apps]
      security:
        - bearer: []
      responses:
        "200":
          description: The app.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/App"
              example:
                id: 019a3b10-7c2d-7e4f-8a5b-6c7d8e9f0a1b
                org_id: 0199f3a0-5b6c-7d8e-9f0a-1b2c3d4e5f60
                name: Shop website
                allowed_origins: ["https://shop.example", "http://localhost:3000"]
                created_at: "2026-10-29T10:00:00Z"
                updated_at: "2026-10-29T10:00:00Z"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: identity.updateApp
      summary: Update an app
      description: |
        Sets the name or the origin allow-list of an app. A new list replaces the old list.
        - Needs the role `owner` or `admin` in the org. The stored membership must agree. A `member` or an `operator` gets 403.
        - A widget token issued before the change stays valid until it expires (15 minutes or less).
        - Emits no event yet.
      tags: [apps]
      security:
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAppRequest"
            example:
              allowed_origins: ["https://shop.example", "https://www.shop.example"]
      responses:
        "200":
          description: The app after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/App"
              example:
                id: 019a3b10-7c2d-7e4f-8a5b-6c7d8e9f0a1b
                org_id: 0199f3a0-5b6c-7d8e-9f0a-1b2c3d4e5f60
                name: Shop website
                allowed_origins: ["https://shop.example", "https://www.shop.example"]
                created_at: "2026-10-29T10:00:00Z"
                updated_at: "2026-10-29T11:00:00Z"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: identity.deleteApp
      summary: Delete an app
      description: |
        Deletes the app. Its widgets get no new token.
        - Needs the role `owner` or `admin` in the org. The stored membership must agree. A `member` or an `operator` gets 403.
        - A widget token issued before the delete stays valid until it expires (15 minutes or less).
        - Emits no event yet.
      tags: [apps]
      security:
        - bearer: []
      responses:
        "204":
          description: App deleted.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/apps/{appId}/widget-tokens:
    parameters:
      - $ref: "#/components/parameters/AppId"
    post:
      operationId: identity.createWidgetToken
      summary: Issue a widget token
      description: |
        Issues a short-lived widget token for the signed-in caller, bound to the app and to the request origin.
        - The Bearer token is the Zitadel access token of the signed-in user. A widget token never gets a new widget token.
        - The caller must be a member of the app's org (token and stored membership). Else 404, same as an unknown app.
        - The `Origin` header must equal one entry of the allow-list: same scheme, host and port. No prefix, suffix or wildcard match. Else 403 `origin_not_allowed`.
        - The token is a JWT (`typ` `at+jwt`, `alg` `ES256`), signed by identity. It lives 15 minutes or less (`expires_in`).
        - Claims: `iss` (identity), `aud`, `sub` (the user), `urn:zitadel:iam:user:resourceowner:id` (the Zitadel org), `client_id` (the app id), `synthwerk:origin` (the canonical origin), `iat`, `nbf`, `exp`, `jti`. No roles: a widget token is never an admin token.
        - Verify it with the key set at `/.well-known/jwks.json` of identity (RFC 7517). A service that accepts it must also compare `synthwerk:origin` with the `Origin` header.
        - Browsers send a CORS preflight first. Identity answers it with the CORS headers only for an allowed origin.
      tags: [widget-tokens]
      security:
        - bearer: []
      parameters:
        - name: Origin
          in: header
          required: true
          description: The page origin. Browsers set it. Compared exactly with the allow-list after the default port is removed.
          schema:
            type: string
            maxLength: 256
      responses:
        "201":
          description: Widget token issued.
          headers:
            Cache-Control:
              description: Always `no-store`.
              schema:
                type: string
                maxLength: 32
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WidgetToken"
              example:
                access_token: eyJhbGciOiJFUzI1NiIsImtpZCI6IjNxV2lxIiwidHlwIjoiYXQrand0In0.e30.c2lnbmF0dXJl
                token_type: Bearer
                expires_in: 600
                expires_at: "2026-10-29T10:10:00Z"
                app_id: 019a3b10-7c2d-7e4f-8a5b-6c7d8e9f0a1b
                origin: https://shop.example
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/OriginNotAllowed"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Zitadel access token. The subject, the org and the roles come from its claims.
  parameters:
    OrgId:
      name: orgId
      in: path
      required: true
      description: Org id.
      schema:
        type: string
        format: uuid
        maxLength: 36
    UserId:
      name: userId
      in: path
      required: true
      description: Subject id (token `sub`) of the member.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: "^[A-Za-z0-9_-]+$"
    AppId:
      name: appId
      in: path
      required: true
      description: App id.
      schema:
        type: string
        format: uuid
        maxLength: 36
  responses:
    InvalidRequest:
      description: The body or a parameter is not valid. Code `invalid_request`.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://schemas.synthwerk.dev/problems/invalid_request
            title: Invalid request
            status: 400
            code: invalid_request
            detail: slug must match ^[a-z][a-z0-9-]*$.
    Unauthenticated:
      description: No token, bad signature, expired, wrong issuer or audience. Code `unauthenticated`.
      headers:
        WWW-Authenticate:
          description: Always `Bearer`.
          schema:
            type: string
            maxLength: 256
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://schemas.synthwerk.dev/problems/unauthenticated
            title: Unauthenticated
            status: 401
            code: unauthenticated
    Forbidden:
      description: The caller's role does not allow the call. Code `forbidden`. The body is generic.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://schemas.synthwerk.dev/problems/forbidden
            title: Forbidden
            status: 403
            code: forbidden
    NotFound:
      description: Unknown org or member, or an org the caller does not belong to. Same body in every case. Code `not_found`.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://schemas.synthwerk.dev/problems/not_found
            title: Not found
            status: 404
            code: not_found
    Conflict:
      description: The slug is taken. Code `slug_taken`.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://schemas.synthwerk.dev/problems/slug_taken
            title: Slug taken
            status: 409
            code: slug_taken
    RoleConflict:
      description: |
        The role change breaks an org rule.
        - `last_owner`: the org would lose its last owner.
        - `own_role`: the caller tried to change their own role.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://schemas.synthwerk.dev/problems/last_owner
            title: Last owner
            status: 409
            code: last_owner
    OriginNotAllowed:
      description: The `Origin` header is missing, not valid, or not in the allow-list of the app. Code `origin_not_allowed`. The body never lists the allowed origins.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://schemas.synthwerk.dev/problems/origin_not_allowed
            title: Origin not allowed
            status: 403
            code: origin_not_allowed
    UpstreamUnavailable:
      description: Zitadel did not take the change. Nothing changed. Code `upstream_unavailable`. Retry later.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://schemas.synthwerk.dev/problems/upstream_unavailable
            title: Upstream unavailable
            status: 502
            code: upstream_unavailable
  schemas:
    Role:
      type: string
      enum: [owner, admin, member, operator]
      description: |
        - `owner`, `admin`, `member`: org roles.
        - `operator`: platform role. It is never an org membership.
    Org:
      type: object
      additionalProperties: false
      required: [id, name, slug, created_at]
      properties:
        id:
          type: string
          format: uuid
          maxLength: 36
        name:
          type: string
          minLength: 1
          maxLength: 128
          description: Display name.
        slug:
          type: string
          minLength: 2
          maxLength: 64
          pattern: "^[a-z][a-z0-9-]*$"
          description: Unique, URL-safe name.
        created_at:
          type: string
          format: date-time
          maxLength: 40
    Entitlements:
      type: object
      additionalProperties: false
      required: [org_id, plan, limits, version, updated_at]
      description: The plan of an org and the limits it gives. Identity owns them.
      properties:
        org_id:
          type: string
          format: uuid
          maxLength: 36
        plan:
          type: string
          minLength: 1
          maxLength: 32
          pattern: "^[a-z][a-z0-9_]*$"
          description: |
            Plan name. `free` today; paid plans come in M5.
            Clients must accept plan names they do not know and read `limits`, never the name.
        limits:
          $ref: "#/components/schemas/EntitlementLimits"
        version:
          type: integer
          format: int64
          minimum: 1
          description: Goes up by one on every change. A consumer drops an event with a version lower than the one it holds.
        updated_at:
          type: string
          format: date-time
          maxLength: 40
    EntitlementLimits:
      type: object
      additionalProperties: false
      required: [llm_tokens_per_user_per_day, llm_tokens_per_org_per_day, apps_per_org]
      description: |
        Limits of the plan. `0` means no limit. A day is a UTC day.
        The schema is closed. A new limit comes with a new spec minor version and regenerated clients.
      properties:
        llm_tokens_per_user_per_day:
          type: integer
          format: int64
          minimum: 0
          description: LLM tokens one user may use in this org per UTC day.
        llm_tokens_per_org_per_day:
          type: integer
          format: int64
          minimum: 0
          description: LLM tokens all users of the org may use together per UTC day.
        apps_per_org:
          type: integer
          format: int32
          minimum: 0
          maximum: 10000
          description: Apps the org may have.
    OrgRole:
      type: string
      enum: [owner, admin, member]
      description: An org role. `operator` is never an org role.
    Member:
      type: object
      additionalProperties: false
      required: [user_id, role, updated_at]
      properties:
        user_id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: "^[A-Za-z0-9_-]+$"
          description: Subject id (token `sub`). Never an email.
        role:
          $ref: "#/components/schemas/OrgRole"
        updated_at:
          type: string
          format: date-time
          maxLength: 40
    MemberPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/Member"
        next_cursor:
          type: string
          maxLength: 256
          description: Cursor of the next page. Absent on the last page.
    ChangeMemberRoleRequest:
      type: object
      additionalProperties: false
      required: [role]
      properties:
        role:
          $ref: "#/components/schemas/OrgRole"
    OrgPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/Org"
        next_cursor:
          type: string
          maxLength: 256
          description: Cursor of the next page. Absent on the last page.
    CreateOrgRequest:
      type: object
      additionalProperties: false
      required: [name, slug]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        slug:
          type: string
          minLength: 2
          maxLength: 64
          pattern: "^[a-z][a-z0-9-]*$"
    Me:
      type: object
      additionalProperties: false
      required: [subject, org, roles]
      properties:
        subject:
          type: string
          minLength: 1
          maxLength: 128
          description: Token `sub`. Never an email.
        org:
          $ref: "#/components/schemas/Org"
        roles:
          type: array
          maxItems: 4
          uniqueItems: true
          description: Roles of the caller in `org`, plus `operator` for a platform operator.
          items:
            $ref: "#/components/schemas/Role"
    AppOrigin:
      type: string
      minLength: 8
      maxLength: 256
      description: |
        A web origin: `scheme://host[:port]`. Identity stores and returns the canonical form.
        - Scheme `https`. Scheme `http` only for `localhost`, `127.0.0.1` and `[::1]`.
        - Host: a DNS name (ASCII; use punycode for other characters), an IPv4 address or a bracketed IPv6 address. Identity stores it in lower case.
        - Port: optional, 1 to 65535. The default port (443 for https, 80 for http) is removed.
        - No path (not even `/`), no query, no fragment, no user info, no wildcard. `null` is not an origin.
        - Match is exact on the canonical form: `https://shop.example` does not match `https://shop.example.evil.test`, `https://a.shop.example` or `http://shop.example`.
    App:
      type: object
      additionalProperties: false
      required: [id, org_id, name, allowed_origins, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
          maxLength: 36
        org_id:
          type: string
          format: uuid
          maxLength: 36
        name:
          type: string
          minLength: 1
          maxLength: 128
          description: Display name.
        allowed_origins:
          type: array
          minItems: 1
          maxItems: 20
          uniqueItems: true
          description: Origins that may get a widget token for this app. Canonical form.
          items:
            $ref: "#/components/schemas/AppOrigin"
        created_at:
          type: string
          format: date-time
          maxLength: 40
        updated_at:
          type: string
          format: date-time
          maxLength: 40
    AppPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/App"
        next_cursor:
          type: string
          maxLength: 256
          description: Cursor of the next page. Absent on the last page.
    CreateAppRequest:
      type: object
      additionalProperties: false
      required: [name, allowed_origins]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        allowed_origins:
          type: array
          minItems: 1
          maxItems: 20
          description: Two entries with the same canonical form are refused (400).
          items:
            $ref: "#/components/schemas/AppOrigin"
    UpdateAppRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      description: At least one field. A field that is absent keeps its value.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        allowed_origins:
          type: array
          minItems: 1
          maxItems: 20
          description: Replaces the whole list. Two entries with the same canonical form are refused (400).
          items:
            $ref: "#/components/schemas/AppOrigin"
    WidgetToken:
      type: object
      additionalProperties: false
      required: [access_token, token_type, expires_in, expires_at, app_id, origin]
      properties:
        access_token:
          type: string
          minLength: 1
          maxLength: 4096
          description: "The widget token (JWT). Send it in the header `Authorization` as `Bearer <token>`, from the same origin. Never log it."
        token_type:
          type: string
          enum: [Bearer]
        expires_in:
          type: integer
          minimum: 1
          maximum: 900
          description: Seconds until the token expires. Never more than 900 (15 minutes).
        expires_at:
          type: string
          format: date-time
          maxLength: 40
        app_id:
          type: string
          format: uuid
          maxLength: 36
        origin:
          $ref: "#/components/schemas/AppOrigin"
    Problem:
      type: object
      additionalProperties: false
      required: [type, title, status, code]
      description: |
        RFC 9457 problem details with the stable Synthwerk `code`.
        Clients branch on `code`, never on `title` or `detail`, and must accept unknown codes.

        | Code | Status | Cause |
        |---|---|---|
        | `invalid_request` | 400 | Body or parameter not valid. |
        | `unauthenticated` | 401 | Token missing or not valid. |
        | `forbidden` | 403 | Role does not allow the call. |
        | `not_found` | 404 | Unknown org or member, or no membership. |
        | `slug_taken` | 409 | Another org has the slug. |
        | `last_owner` | 409 | The org would lose its last owner. |
        | `own_role` | 409 | The caller tried to change their own role. |
        | `origin_not_allowed` | 403 | The `Origin` header is not in the allow-list of the app. |
        | `upstream_unavailable` | 502 | Zitadel did not take the change. Nothing changed. |
      properties:
        type:
          type: string
          format: uri
          maxLength: 256
          description: "`https://schemas.synthwerk.dev/problems/<code>`."
        title:
          type: string
          maxLength: 128
          description: Short summary of the problem type. Same for every instance.
        status:
          type: integer
          minimum: 100
          maximum: 599
        code:
          type: string
          maxLength: 64
          pattern: "^[a-z][a-z0-9_]*$"
          description: Stable machine code, for example `not_found`.
        detail:
          type: string
          maxLength: 512
          description: Explanation for this instance. No secrets, no personal data.
        instance:
          type: string
          maxLength: 256
          description: URI of this instance, for example the request path.
        trace_id:
          type: string
          maxLength: 32
          pattern: "^[0-9a-f]{32}$"
          description: W3C trace id of the request, for support.
